services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Required for the Agents tab (Agent Builder) on self-hosted n8n
      - N8N_ENABLED_MODULES=agents
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
